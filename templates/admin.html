<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Admin | RISE AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="topbar"><div class="brand"><img src="{{ url_for('static', filename='images/college-logo.jpg') }}"><div><strong>RISE AI</strong><span>FAQ Administration</span></div></div><a class="admin-link" href="/admin/logout">Logout</a></header>
<main class="admin-wrap"><div class="admin-title"><div><span class="eyebrow">KNOWLEDGE BASE</span><h1>Manage FAQs</h1><p>Add college-approved answers and mark them verified only after confirmation.</p></div><a class="outline-btn" href="/">View chatbot</a></div>
<div class="stats"><div><b id="stat-total">—</b><span>Total FAQs</span></div><div><b id="stat-verified">—</b><span>Verified FAQs</span></div><div><b id="stat-chats">—</b><span>Questions asked</span></div></div>
<section class="admin-card"><h2>Add a FAQ</h2><form id="faq-form" class="faq-form"><label>Category<select id="category" required></select></label><label>Question<input id="faq-question" required placeholder="Enter a frequently asked question"></label><label>Answer<textarea id="faq-answer" required rows="3" placeholder="Enter the official answer"></textarea></label><label>Status<select id="faq-status"><option value="sample">Sample – not verified</option><option value="verified">Verified by college</option></select></label><button class="primary-btn" type="submit">Add FAQ</button></form><p id="form-status" class="form-status"></p></section>
<section class="admin-card"><h2>Existing FAQs</h2><div id="faq-list" class="faq-list">Loading FAQs…</div></section></main>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script></body></html>
